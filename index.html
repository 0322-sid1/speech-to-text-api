<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STT API Tester</title>
<style>
  :root {
    --ink: #1c1c1e;
    --paper: #faf9f7;
    --line: #d8d5cf;
    --accent: #2f5d50;
    --accent-soft: #e7efec;
    --warn: #a0522d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--paper);
    color: var(--ink);
    display: flex;
    justify-content: center;
    padding: 40px 16px;
  }
  main {
    width: 100%;
    max-width: 620px;
  }
  h1 {
    font-size: 22px;
    margin: 0 0 4px;
  }
  p.sub {
    color: #6b6963;
    margin: 0 0 28px;
    font-size: 14px;
  }
  .row {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
  }
  input[type="text"] {
    flex: 1;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 6px;
    font-size: 14px;
    background: white;
  }
  button {
    border: none;
    border-radius: 6px;
    padding: 10px 18px;
    font-size: 14px;
    cursor: pointer;
    font-weight: 600;
  }
  #recordBtn {
    background: var(--accent);
    color: white;
    width: 100%;
    padding: 14px;
    font-size: 15px;
    transition: background 0.15s;
  }
  #recordBtn.recording {
    background: var(--warn);
  }
  #recordBtn:disabled {
    background: #b9b6ae;
    cursor: not-allowed;
  }
  .status {
    text-align: center;
    margin: 12px 0 24px;
    font-size: 13px;
    color: #6b6963;
    min-height: 16px;
  }
  .card {
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 14px;
    background: white;
  }
  .card h2 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: #8a877e;
    margin: 0 0 8px;
    font-weight: 600;
  }
  .card p {
    margin: 0;
    font-size: 15px;
    line-height: 1.5;
    white-space: pre-wrap;
  }
  .card.clean {
    background: var(--accent-soft);
    border-color: #bcd4c9;
  }
  .meta {
    display: flex;
    gap: 16px;
    font-size: 12px;
    color: #6b6963;
  }
</style>
</head>
<body>
<main>
  <h1>Speech-to-Text Tester</h1>
  <p class="sub">Record from your mic and send it to the /transcribe endpoint.</p>

  <button id="recordBtn">Start Recording</button>
  <div class="status" id="status"></div>

  <div id="results" style="display:none;">
    <div class="meta" style="margin-bottom:12px;">
      <span id="langMeta"></span>
      <span id="flagMeta"></span>
    </div>
    <div class="card clean">
      <h2>Clean Transcript</h2>
      <p id="cleanText"></p>
    </div>
    <div class="card">
      <h2>Raw Transcript</h2>
      <p id="rawText"></p>
    </div>
  </div>
</main>

<script>
let mediaRecorder;
let chunks = [];
let isRecording = false;

const recordBtn = document.getElementById("recordBtn");
const statusEl = document.getElementById("status");
const results = document.getElementById("results");

recordBtn.addEventListener("click", async () => {
  if (!isRecording) {
    await startRecording();
  } else {
    stopRecording();
  }
});

async function startRecording() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    chunks = [];
    mediaRecorder = new MediaRecorder(stream);

    mediaRecorder.ondataavailable = (e) => chunks.push(e.data);
    mediaRecorder.onstop = () => {
      stream.getTracks().forEach((t) => t.stop());
      const blob = new Blob(chunks, { type: "audio/webm" });
      sendAudio(blob);
    };

    mediaRecorder.start();
    isRecording = true;
    recordBtn.textContent = "Stop Recording";
    recordBtn.classList.add("recording");
    statusEl.textContent = "Recording... speak now.";
    results.style.display = "none";
  } catch (err) {
    statusEl.textContent = "Mic access denied or unavailable: " + err.message;
  }
}

function stopRecording() {
  mediaRecorder.stop();
  isRecording = false;
  recordBtn.textContent = "Start Recording";
  recordBtn.classList.remove("recording");
  statusEl.textContent = "Processing...";
}

async function sendAudio(blob) {
  const formData = new FormData();
  formData.append("file", blob, "recording.webm");

  recordBtn.disabled = true;

  try {
    const res = await fetch("/transcribe", {
      method: "POST",
      body: formData,
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.detail || `Request failed (${res.status})`);
    }

    const data = await res.json();

    document.getElementById("cleanText").textContent = data.clean_transcript || "(empty)";
    document.getElementById("rawText").textContent = data.raw_transcript || "(empty)";
    document.getElementById("langMeta").textContent = `Language: ${data.language}`;
    document.getElementById("flagMeta").textContent = `Flagged segments: ${data.flagged_segments_count}`;
    results.style.display = "block";
    statusEl.textContent = "Done.";
  } catch (err) {
    statusEl.textContent = "Error: " + err.message;
  } finally {
    recordBtn.disabled = false;
  }
}
</script>
</body>
</html>
